name: Build VisionSen Mobile v1.7.2+36 Final

on:
  push:
    branches:
      - mobile-v1.7.2-36-final
    paths:
      - 'mobile-build/v1.7.2-36/**'
      - '.github/workflows/build-mobile-v172-36-final.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified 1.7.1+35 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mobile171 mobile172
          mkdir -p /tmp/mobile171 mobile172
          gh run download 35114579272 --repo "$GITHUB_REPOSITORY" -n 'VisionSen-Mobile-v1.7.1+35-WiFi-Fix' -D /tmp/mobile171
          tar -xzf '/tmp/mobile171/VisionSen-Mobile-v1.7.1+35-WiFi-Fix-source.tar.gz' -C mobile172
          echo "MOBILE_ROOT=$PWD/mobile172" >> "$GITHUB_ENV"
          python3 mobile172/tool/validate_strict.py

      - name: Apply Android provisioning lifecycle fixes
        shell: bash
        run: |
          set -euo pipefail
          cat mobile-build/v1.7.2-36/patch/part-*.b64 | base64 -d | gzip -d > /tmp/mobile-v171-to-v172.patch
          echo '45f424466d2d76579b352df40713332c12b33bbcdb2be33895b3f6f769a949ee  /tmp/mobile-v171-to-v172.patch' | sha256sum -c -
          cd "$MOBILE_ROOT"
          patch --batch --forward --dry-run -p1 < /tmp/mobile-v171-to-v172.patch
          patch --batch --forward -p1 < /tmp/mobile-v171-to-v172.patch
          rm -rf tool/__pycache__
          python3 tool/validate_strict.py
          grep -F 'version: 1.7.2+36' pubspec.yaml

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: false

      - name: Prepare Android platform and verify provisioning bridge
        shell: bash
        run: |
          set -euo pipefail
          cd "$MOBILE_ROOT"
          bash tool/bootstrap_android.sh
          cat android-gradle.properties >> android/gradle.properties
          echo 'dev.steenbakker.mobile_scanner.useUnbundled=true' >> android/gradle.properties
          MAIN='android/app/src/main/kotlin/com/visionsen/visionsen_setup/MainActivity.kt'
          test -f "$MAIN"
          grep -F '"getProvisioningCapabilities"' "$MAIN"
          grep -F 'Build.VERSION.SDK_INT < Build.VERSION_CODES.TIRAMISU' "$MAIN"
          grep -F '"connectProvisioningWifi"' "$MAIN"
          grep -F 'cleanupCallback(this)' "$MAIN"
          ! grep -F 'scanProvisioningWifi' "$MAIN"
          grep -F 'android.permission.NEARBY_WIFI_DEVICES' android/app/src/main/AndroidManifest.xml
          grep -F 'minSdk = 23' android/app/build.gradle || grep -F 'minSdkVersion 23' android/app/build.gradle

      - name: Resolve packages
        shell: bash
        run: |
          cd "$MOBILE_ROOT"
          flutter pub get

      - name: Analyze
        shell: bash
        run: |
          cd "$MOBILE_ROOT"
          flutter analyze --no-fatal-infos

      - name: Test
        shell: bash
        run: |
          cd "$MOBILE_ROOT"
          flutter test

      - name: Build release APK
        shell: bash
        run: |
          cd "$MOBILE_ROOT"
          flutter build apk --release

      - name: Verify APK native provisioning methods
        shell: bash
        run: |
          set -euo pipefail
          APK="$MOBILE_ROOT/build/app/outputs/flutter-apk/app-release.apk"
          unzip -p "$APK" classes.dex > /tmp/classes.dex
          grep -aF 'getProvisioningCapabilities' /tmp/classes.dex
          grep -aF 'connectProvisioningWifi' /tmp/classes.dex
          grep -aF 'disconnectProvisioningWifi' /tmp/classes.dex
          grep -aF 'NEARBY_WIFI_DEVICES' /tmp/classes.dex
          if grep -aF 'scanProvisioningWifi' /tmp/classes.dex; then
            echo 'Dead scanProvisioningWifi bridge found in APK'; exit 1
          fi

      - name: Package final APK source and hashes
        shell: bash
        run: |
          set -euo pipefail
          cp "$MOBILE_ROOT/build/app/outputs/flutter-apk/app-release.apk" VisionSen-Mobile-v1.7.2+36-Final.apk
          rm -rf "$MOBILE_ROOT/tool/__pycache__"
          find "$MOBILE_ROOT" -name '*.pyc' -delete
          tar -czf VisionSen-Mobile-v1.7.2+36-Final-source.tar.gz -C "$MOBILE_ROOT" README.md analysis_options.yaml android-gradle.properties lib pubspec.yaml test tool
          rm -rf /tmp/mobile172-check && mkdir /tmp/mobile172-check
          tar -xzf VisionSen-Mobile-v1.7.2+36-Final-source.tar.gz -C /tmp/mobile172-check
          python3 /tmp/mobile172-check/tool/validate_strict.py
          test -z "$(find /tmp/mobile172-check -name '__pycache__' -o -name '*.pyc' -print -quit)"
          sha256sum VisionSen-Mobile-v1.7.2+36-Final.apk VisionSen-Mobile-v1.7.2+36-Final-source.tar.gz > MOBILE-V172-SHA256SUMS.txt
          cat MOBILE-V172-SHA256SUMS.txt

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: VisionSen-Mobile-v1.7.2+36-Final
          path: |
            VisionSen-Mobile-v1.7.2+36-Final.apk
            VisionSen-Mobile-v1.7.2+36-Final-source.tar.gz
            MOBILE-V172-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
