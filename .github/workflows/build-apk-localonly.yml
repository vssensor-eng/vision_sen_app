name: Build Android Local-Only WiFi

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Prepare Android hardened provisioning
        run: bash tool/bootstrap_android_v164.sh

      - name: Auto-connect system-selected VisionSen device
        shell: bash
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path
          p = Path('lib/screens/wifi_provision_screen.dart')
          t = p.read_text(encoding='utf-8')
          old = """    _setMessage(
                '${devices.length} VisionSen cihazı bulundu. Bağlanmak istediğiniz cihazı seçin.',
              );
          """
          new = """    if (devices.length == 1) {
                await _connectDevice(devices.first);
                return;
              }

              _setMessage(
                '${devices.length} VisionSen cihazı bulundu. Bağlanmak istediğiniz cihazı seçin.',
              );
          """
          if old not in t:
              raise SystemExit('auto-connect patch target not found')
          t = t.replace(old, new, 1)
          t = t.replace(
              'Mobil v1.6.3+21 • Konum izinsiz Wi-Fi seçim + DHCP doğrulamalı Provisioning Protocol v2',
              'Mobil v1.6.4+22 • Konum izinsiz Wi-Fi + sağlamlaştırılmış izin akışı',
          )
          p.write_text(t, encoding='utf-8')
          PYEOF

      - name: Verify hardened no-location Wi-Fi design
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          MAIN=android/app/src/main/kotlin/com/visionsen/visionsen_setup/MainActivity.kt
          ! grep -q 'ACCESS_FINE_LOCATION' "$MANIFEST"
          ! grep -q 'ACCESS_COARSE_LOCATION' "$MANIFEST"
          ! grep -q 'startScan' "$MAIN"
          ! grep -q 'scanResults' "$MAIN"
          grep -q 'NEARBY_WIFI_DEVICES' "$MANIFEST"
          grep -q 'neverForLocation' "$MANIFEST"
          grep -q 'CompanionDeviceManager' "$MAIN"
          grep -q 'WifiDeviceFilter' "$MAIN"
          grep -q 'activeAssociationInfo' "$MAIN"
          grep -q 'releaseActiveAssociation' "$MAIN"
          grep -q 'postDelayed' "$MAIN"
          grep -q 'WIFI_SECURITY' "$MAIN"
          grep -q 'ANDROID_LEGACY_LOCATION_REQUIRED' "$MAIN"
          grep -q 'await _connectDevice(devices.first)' lib/screens/wifi_provision_screen.dart
          grep -q 'version: 1.6.4+22' pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: visionsen-v1.6.4-nearby-permission-fix-ci-apk
          path: build/app/outputs/flutter-apk/app-release.apk
