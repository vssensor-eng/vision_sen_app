name: Build Android Local-Only WiFi

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Prepare Android local-only provisioning
        run: bash tool/bootstrap_android_localonly.sh

      - name: Verify no-location Wi-Fi design
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          MAIN=android/app/src/main/kotlin/com/visionsen/visionsen_setup/MainActivity.kt
          ! grep -q 'ACCESS_FINE_LOCATION' "$MANIFEST"
          ! grep -q 'ACCESS_COARSE_LOCATION' "$MANIFEST"
          ! grep -q 'startScan' "$MAIN"
          ! grep -q 'scanResults' "$MAIN"
          grep -q 'NEARBY_WIFI_DEVICES' "$MANIFEST"
          grep -q 'neverForLocation' "$MANIFEST"
          grep -q 'companion_device_setup' "$MANIFEST"
          grep -q 'CompanionDeviceManager' "$MAIN"
          grep -q 'WifiDeviceFilter' "$MAIN"

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: visionsen-v1.6.3-no-location-wifi-ci-apk
          path: build/app/outputs/flutter-apk/app-release.apk
