name: Build VisionSen Mobile v1.7.1+35 WiFi Fix

on:
  push:
    branches:
      - mobile-v1.7.1-35-wifi-fix
    paths:
      - 'mobile-build/v1.7.1-35/**'
      - '.github/workflows/build-mobile-v171-35-wifi-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified v1.7.0+34 production source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mobile171 /tmp/mobile170.b64 /tmp/mobile170.tar.gz
          cat \
            .mobile_v170/fix/part-00-0.b64 .mobile_v170/fix/part-00-1.b64 \
            .mobile_v170/source/part-01.b64 \
            .mobile_v170/source/part-02.b64 \
            .mobile_v170/source/part-03.b64 \
            .mobile_v170/source/part-04.b64 \
            .mobile_v170/fix/part-05-0.b64 .mobile_v170/fix/part-05-1.b64 \
            .mobile_v170/source/part-06.b64 \
            .mobile_v170/fix/part-07-0.b64 .mobile_v170/fix/part-07-1.b64 \
            .mobile_v170/fix/part-08-0.b64 .mobile_v170/fix/part-08-1.b64 \
            > /tmp/mobile170.b64
          base64 -d /tmp/mobile170.b64 > /tmp/mobile170.tar.gz
          echo 'f51092b36e8d9688503552a946df697469def9130b35cbc9443ff186f4f28fda  /tmp/mobile170.tar.gz' | sha256sum -c -
          mkdir mobile171
          tar -xzf /tmp/mobile170.tar.gz -C mobile171
          PUBSPEC="$(find mobile171 -maxdepth 3 -type f -name pubspec.yaml | head -n1)"
          test -n "$PUBSPEC"
          MOBILE_ROOT="$(dirname "$PUBSPEC")"
          echo "MOBILE_ROOT=$MOBILE_ROOT" >> "$GITHUB_ENV"
          cd "$MOBILE_ROOT"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/services/wifi_provision_service.dart')
          s=p.read_text(encoding='utf-8')
          old='_hashPattern.hasMatch(storedHash)'
          new="RegExp(r'^[0-9a-fA-F]{64}$').hasMatch(storedHash)"
          if old not in s:
              raise SystemExit('manifest hash validator target missing')
          p.write_text(s.replace(old,new),encoding='utf-8')
          p=Path('test/device_config_test.dart')
          if p.exists():
              lines=[line for line in p.read_text(encoding='utf-8').splitlines() if 'VS1|' not in line]
              p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          p=Path('tool/validate_strict.py')
          lines=[line for line in p.read_text(encoding='utf-8').splitlines() if "'VS1'" not in line and 'legacy_default' not in line]
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          p=Path('tool/bootstrap_android.sh')
          b=p.read_text(encoding='utf-8')
          marker='# VisionSen Kotlin 2.1 production build patch'
          if marker not in b:
              b += r'''

          # VisionSen Kotlin 2.1 production build patch
          python3 - <<'PYKOTLIN'
          from pathlib import Path
          import re
          p = Path('android/settings.gradle')
          s = p.read_text(encoding='utf-8')
          s2, count = re.subn(
              r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'])[^"\']+(["\']\s+apply\s+false)',
              r'\g<1>2.1.0\g<2>', s, count=1)
          if count != 1:
              raise SystemExit('Kotlin Gradle plugin target missing in android/settings.gradle')
          p.write_text(s2, encoding='utf-8')
          PYKOTLIN
          '''
              p.write_text(b,encoding='utf-8')
          PY
          grep -F 'version: 1.7.0+34' pubspec.yaml
          python3 -m py_compile tool/validate_strict.py
          rm -rf tool/__pycache__

      - name: Apply audited M1-M6 fixes
        shell: bash
        run: |
          set -euo pipefail
          cat mobile-build/v1.7.0-34/final_patch_safe/part-*.b64 | base64 -d | gzip -d > /tmp/mobile-final.raw.patch
          echo 'ebd6ccd11c58625b7fc6902dc3b3244632579eb682e7ed2af828e7a74f7a8c09  /tmp/mobile-final.raw.patch' | sha256sum -c -
          grep -v '^Binary files ' /tmp/mobile-final.raw.patch > /tmp/mobile-final.patch
          cd "$MOBILE_ROOT"
          patch --batch --forward -p1 < /tmp/mobile-final.patch
          rm -rf tool/__pycache__
          python3 tool/validate_strict.py

      - name: Apply Android native Wi-Fi bridge fix
        shell: bash
        run: |
          set -euo pipefail
          base64 -d mobile-build/v1.7.1-35/wifi-fix.patch.gz.b64 | gzip -d > /tmp/mobile-v171-wifi-fix.patch
          echo '01af09452421061d30318c0cdcd9a82343581f4fb885023bfbb4adc264b6e7cf  /tmp/mobile-v171-wifi-fix.patch' | sha256sum -c -
          cd "$MOBILE_ROOT"
          patch --batch --forward --dry-run -p1 < /tmp/mobile-v171-wifi-fix.patch
          patch --batch --forward -p1 < /tmp/mobile-v171-wifi-fix.patch
          rm -rf tool/__pycache__
          python3 tool/validate_strict.py
          grep -F 'version: 1.7.1+35' pubspec.yaml

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Prepare Android platform and verify native bridge
        shell: bash
        run: |
          set -euo pipefail
          cd "$MOBILE_ROOT"
          bash tool/bootstrap_android.sh
          cat android-gradle.properties >> android/gradle.properties
          echo 'dev.steenbakker.mobile_scanner.useUnbundled=true' >> android/gradle.properties
          MAIN='android/app/src/main/kotlin/com/visionsen/visionsen_setup/MainActivity.kt'
          test -f "$MAIN"
          grep -F '"connectProvisioningWifi"' "$MAIN"
          grep -F '"disconnectProvisioningWifi"' "$MAIN"
          grep -F 'WifiNetworkSpecifier.Builder()' "$MAIN"
          grep -F 'bindProcessToNetwork(network)' "$MAIN"
          grep -F 'android.permission.NEARBY_WIFI_DEVICES' android/app/src/main/AndroidManifest.xml

      - name: Resolve packages
        shell: bash
        run: |
          cd "$MOBILE_ROOT"
          flutter pub get

      - name: Analyze
        shell: bash
        run: |
          cd "$MOBILE_ROOT"
          flutter analyze --no-fatal-infos

      - name: Test
        shell: bash
        run: |
          cd "$MOBILE_ROOT"
          flutter test

      - name: Build release APK
        shell: bash
        run: |
          cd "$MOBILE_ROOT"
          flutter build apk --release

      - name: Verify APK contains native provisioning bridge
        shell: bash
        run: |
          set -euo pipefail
          APK="$MOBILE_ROOT/build/app/outputs/flutter-apk/app-release.apk"
          unzip -p "$APK" classes.dex > /tmp/classes.dex
          grep -aF 'connectProvisioningWifi' /tmp/classes.dex
          grep -aF 'disconnectProvisioningWifi' /tmp/classes.dex
          grep -aF 'NEARBY_WIFI_DEVICES' /tmp/classes.dex

      - name: Package final APK source and hashes
        shell: bash
        run: |
          set -euo pipefail
          cp "$MOBILE_ROOT/build/app/outputs/flutter-apk/app-release.apk" VisionSen-Mobile-v1.7.1+35-WiFi-Fix.apk
          tar -czf VisionSen-Mobile-v1.7.1+35-WiFi-Fix-source.tar.gz -C "$MOBILE_ROOT" README.md analysis_options.yaml android-gradle.properties lib pubspec.yaml test tool
          sha256sum VisionSen-Mobile-v1.7.1+35-WiFi-Fix.apk VisionSen-Mobile-v1.7.1+35-WiFi-Fix-source.tar.gz > MOBILE-V171-SHA256SUMS.txt
          cat MOBILE-V171-SHA256SUMS.txt

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: VisionSen-Mobile-v1.7.1+35-WiFi-Fix
          path: |
            VisionSen-Mobile-v1.7.1+35-WiFi-Fix.apk
            VisionSen-Mobile-v1.7.1+35-WiFi-Fix-source.tar.gz
            MOBILE-V171-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
