name: Build VisionSen Mobile v1.6.13+31 Single Secure APK

on:
  push:
    branches:
      - mobile-v1.6.13-31
    paths:
      - '.github/workflows/build-mobile-v1613-31-single-secure.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore verified v1.6.11+29 source
        uses: actions/download-artifact@v4
        with:
          name: VisionSen-Mobile-v1.6.11+29-Session-Provisioning-Fix
          path: previous
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34902874641

      - name: Promote to v1.6.13+31 single secure APK
        run: |
          set -euo pipefail
          rm -rf source-stage
          mkdir -p source-stage
          unzip -q 'previous/VisionSen-Mobile-v1.6.11+29-source.zip' -d source-stage
          rm -rf lib test tool pubspec.yaml README.md
          cp -a source-stage/artifact-source/lib .
          cp -a source-stage/artifact-source/test .
          cp -a source-stage/artifact-source/tool .
          cp source-stage/artifact-source/pubspec.yaml .
          cp source-stage/artifact-source/README.md .

          python3 - <<'PY'
          from pathlib import Path

          p=Path('pubspec.yaml')
          s=p.read_text(encoding='utf-8')
          if 'version: 1.6.11+29' not in s:
              raise SystemExit('Expected v1.6.11+29 source version missing')
          p.write_text(s.replace('version: 1.6.11+29','version: 1.6.13+31',1),encoding='utf-8')

          p=Path('lib/screens/wifi_provision_screen.dart')
          s=p.read_text(encoding='utf-8')
          s=s.replace(
              'Mobil provisioning servisi sunucuda etkin değil. Web paketini v2.5.82 veya daha yeni sürüme güncelleyin.',
              'Mobil provisioning servisi sunucuda etkin değil. Web paketini v2.5.84 veya daha yeni sürüme güncelleyin.',
          )
          s=s.replace(
              'Mobil v1.6.9+27 • QR-first provisioning • 8 karakter cihaz kodu • otomatik sunucu ayarları',
              'Mobil v1.6.13+31 • QR-first provisioning • 8 karakter cihaz kodu • tek APK',
          )
          p.write_text(s,encoding='utf-8')

          r=Path('README.md')
          if r.exists():
              t=r.read_text(encoding='utf-8').replace('1.6.11+29','1.6.13+31').replace('1.6.9+27','1.6.13+31')
              r.write_text(t,encoding='utf-8')
          PY

      - name: Assert secure provisioning contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          pub=Path('pubspec.yaml').read_text(encoding='utf-8')
          screen=Path('lib/screens/wifi_provision_screen.dart').read_text(encoding='utf-8')
          api=Path('lib/services/mobile_api_service.dart').read_text(encoding='utf-8')
          session=Path('lib/services/app_session.dart').read_text(encoding='utf-8')
          checks={
            'version':('version: 1.6.13+31',pub),
            'dedicated endpoint':("'/mobile/provisioning/bootstrap'",api),
            'screen endpoint call':('widget.session.api.provisioningBootstrap()',screen),
            'remember token':('_storage.write(key: _tokenKey',session),
            'new footer':('Mobil v1.6.13+31',screen),
          }
          missing=[k for k,(n,t) in checks.items() if n not in t]
          if missing: raise SystemExit(f'contract assert failed: {missing}')
          if "bundle['provisioning']" in screen or "['provisioning']" in session:
              raise SystemExit('Provisioning secret must not come from cached bundle')
          if "'/company/key'" in api:
              raise SystemExit('Browser /company/key must not be used by mobile app')
          print('v1.6.13+31 secure single-APK contract PASS')
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Prepare Android platform
        run: bash tool/bootstrap_android_v169.sh

      - name: Enable unbundled ML Kit barcode model
        run: |
          set -euo pipefail
          PROP='dev.steenbakker.mobile_scanner.useUnbundled=true'
          if grep -q '^dev.steenbakker.mobile_scanner.useUnbundled=' android/gradle.properties; then
            sed -i 's/^dev\.steenbakker\.mobile_scanner\.useUnbundled=.*/dev.steenbakker.mobile_scanner.useUnbundled=true/' android/gradle.properties
          else
            printf '\n%s\n' "$PROP" >> android/gradle.properties
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Build single phone APK
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Package APK and source
        run: |
          set -euo pipefail
          mkdir -p out artifact-source
          cp build/app/outputs/flutter-apk/app-release.apk 'out/VisionSen-Mobile-v1.6.13+31.apk'
          if unzip -l 'out/VisionSen-Mobile-v1.6.13+31.apk' | grep -q 'libbarhopper'; then
            echo 'Bundled ML Kit libbarhopper still present; optimization failed.' >&2
            exit 1
          fi
          cp pubspec.yaml README.md artifact-source/
          cp -R lib test tool artifact-source/
          cp android/gradle.properties artifact-source/android-gradle.properties
          zip -qr 'out/VisionSen-Mobile-v1.6.13+31-source.zip' artifact-source
          sha256sum 'out/VisionSen-Mobile-v1.6.13+31.apk' > 'out/VisionSen-Mobile-v1.6.13+31-SHA256.txt'
          stat -c '%n %s bytes' out/*.apk | tee 'out/VisionSen-Mobile-v1.6.13+31-SIZE.txt'

      - name: Upload single APK
        uses: actions/upload-artifact@v4
        with:
          name: VisionSen-Mobile-v1.6.13+31-Single-Secure-APK
          path: out/
          if-no-files-found: error
          retention-days: 30
