name: Build VisionSen Mobile v1.7.0+34 Production Baseline

on:
  push:
    branches:
      - mobile-v1.7.0-34
    paths:
      - '.mobile_v170/**'
      - '.github/workflows/build-mobile-v170-34-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct self-contained production source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mobile170 /tmp/mobile170.b64 /tmp/mobile170.tar.gz
          cat \
            .mobile_v170/fix/part-00-0.b64 .mobile_v170/fix/part-00-1.b64 \
            .mobile_v170/source/part-01.b64 \
            .mobile_v170/source/part-02.b64 \
            .mobile_v170/source/part-03.b64 \
            .mobile_v170/source/part-04.b64 \
            .mobile_v170/fix/part-05-0.b64 .mobile_v170/fix/part-05-1.b64 \
            .mobile_v170/source/part-06.b64 \
            .mobile_v170/fix/part-07-0.b64 .mobile_v170/fix/part-07-1.b64 \
            .mobile_v170/fix/part-08-0.b64 .mobile_v170/fix/part-08-1.b64 \
            > /tmp/mobile170.b64
          base64 -d /tmp/mobile170.b64 > /tmp/mobile170.tar.gz
          echo 'f51092b36e8d9688503552a946df697469def9130b35cbc9443ff186f4f28fda  /tmp/mobile170.tar.gz' | sha256sum -c -
          mkdir mobile170
          tar -xzf /tmp/mobile170.tar.gz -C mobile170
          PUBSPEC="$(find mobile170 -maxdepth 3 -type f -name pubspec.yaml | head -n1)"
          test -n "$PUBSPEC"
          MOBILE_ROOT="$(dirname "$PUBSPEC")"
          echo "MOBILE_ROOT=$MOBILE_ROOT" >> "$GITHUB_ENV"
          cd "$MOBILE_ROOT"
          grep -F 'version: 1.7.0+34' pubspec.yaml
          python3 tool/validate_strict.py
          ! grep -R "VS1" -n lib test tool README.md
          ! grep -R "protocol 3\|protocol_version.*3\|legacy_default" -n lib test tool README.md
          echo "Mobile self-contained source: PASS ($MOBILE_ROOT)"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Prepare Android platform
        shell: bash
        run: |
          set -euo pipefail
          cd "$MOBILE_ROOT"
          bash tool/bootstrap_android.sh
          cat android-gradle.properties >> android/gradle.properties
          echo 'dev.steenbakker.mobile_scanner.useUnbundled=true' >> android/gradle.properties

      - name: Resolve packages
        shell: bash
        run: |
          cd "$MOBILE_ROOT"
          flutter pub get

      - name: Analyze
        shell: bash
        run: |
          cd "$MOBILE_ROOT"
          flutter analyze --no-fatal-infos

      - name: Test
        shell: bash
        run: |
          cd "$MOBILE_ROOT"
          flutter test

      - name: Build release APK
        shell: bash
        run: |
          cd "$MOBILE_ROOT"
          flutter build apk --release

      - name: Package source and hashes
        shell: bash
        run: |
          set -euo pipefail
          cp "$MOBILE_ROOT/build/app/outputs/flutter-apk/app-release.apk" VisionSen-Mobile-v1.7.0+34.apk
          tar -czf VisionSen-Mobile-v1.7.0+34-source.tar.gz -C "$MOBILE_ROOT" README.md analysis_options.yaml android-gradle.properties lib pubspec.yaml test tool
          sha256sum VisionSen-Mobile-v1.7.0+34.apk VisionSen-Mobile-v1.7.0+34-source.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APK and self-contained source
        uses: actions/upload-artifact@v4
        with:
          name: VisionSen-Mobile-v1.7.0+34-Production-Baseline
          path: |
            VisionSen-Mobile-v1.7.0+34.apk
            VisionSen-Mobile-v1.7.0+34-source.tar.gz
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
