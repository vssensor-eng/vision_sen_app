name: OIM3 v2.1.10 Build

on:
  push:
    branches:
      - oim3-build-v2.1.10
    paths:
      - 'oim3-build/v2.1.10/**'
      - '.github/workflows/oim3-v2.1.10-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify OIM3 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/oim3-src oim3-build/v2.1.10/project
          cat oim3-build/v2.1.10/source3/part-*.b64 | base64 -d > /tmp/oim3-src/source.tar.xz
          echo '402a28487cc01cc6e31f0e5eb9b8b1d02b8bc416c8e2e149692869edd0f2b88d  /tmp/oim3-src/source.tar.xz' | sha256sum -c -
          tar -xJf /tmp/oim3-src/source.tar.xz -C oim3-build/v2.1.10/project
          grep -F 'set(PROJECT_VER "2.1.10")' oim3-build/v2.1.10/project/CMakeLists.txt
          echo 'SOURCE_SHA256=402a28487cc01cc6e31f0e5eb9b8b1d02b8bc416c8e2e149692869edd0f2b88d' >> "$GITHUB_ENV"

      - name: Build ESP32 firmware with ESP-IDF v6.1
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32
          path: oim3-build/v2.1.10/project
          command: idf.py build

      - name: Collect PC Tool binaries
        shell: bash
        run: |
          set -euo pipefail
          P='oim3-build/v2.1.10/project/build'
          A='oim3-build/v2.1.10/artifact'
          mkdir -p "$A"
          test -s "$P/bootloader/bootloader.bin"
          test -s "$P/partition_table/partition-table.bin"
          test -s "$P/ota_data_initial.bin"
          test -s "$P/visionsen_oim3.bin"
          cp "$P/bootloader/bootloader.bin" "$A/bootloader.bin"
          cp "$P/partition_table/partition-table.bin" "$A/partition-table.bin"
          cp "$P/ota_data_initial.bin" "$A/ota_data_initial.bin"
          cp "$P/visionsen_oim3.bin" "$A/visionsen_oim3.bin"
          if [ -f "$P/flasher_args.json" ]; then cp "$P/flasher_args.json" "$A/build-flasher_args.json"; fi
          sha256sum "$A"/*.bin | sed "s#$A/##" > "$A/SHA256SUMS.txt"
          printf 'source_sha256=%s\nesp_idf=v6.1\ntarget=esp32\nproject_version=2.1.10\n' "$SOURCE_SHA256" > "$A/BUILD_INFO.txt"
          ls -lh "$A"

      - name: Upload PC Tool build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisionSen-OIM3-v2.1.10-build
          path: oim3-build/v2.1.10/artifact/
          if-no-files-found: error
          retention-days: 7
