name: Build VisionSen Mobile v1.6.11+29 Session Provisioning Fix

on:
  push:
    branches:
      - mobile-v1.6.11-29
    paths:
      - '.github/workflows/build-mobile-v1611-29-session-provisioning.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore verified v1.6.9+27 production source
        uses: actions/download-artifact@v4
        with:
          name: VisionSen-Mobile-v1.6.9+27-Production-Android
          path: previous
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34901024377

      - name: Apply v1.6.11+29 session and provisioning fix
        run: |
          set -euo pipefail
          rm -rf source-stage
          mkdir -p source-stage
          unzip -q 'previous/VisionSen-Mobile-v1.6.9+27-source.zip' -d source-stage
          rm -rf lib test tool pubspec.yaml README.md
          cp -a source-stage/artifact-source/lib .
          cp -a source-stage/artifact-source/test .
          cp -a source-stage/artifact-source/tool .
          cp source-stage/artifact-source/pubspec.yaml .
          cp source-stage/artifact-source/README.md .

          python3 - <<'PY'
          from pathlib import Path

          # Version.
          p = Path('pubspec.yaml')
          s = p.read_text(encoding='utf-8')
          if 'version: 1.6.9+27' not in s:
              raise SystemExit('Expected v1.6.9+27 source version not found')
          s = s.replace('version: 1.6.9+27', 'version: 1.6.11+29', 1)
          p.write_text(s, encoding='utf-8')

          # Provisioning must use the dedicated mobile Bearer endpoint.
          p = Path('lib/screens/wifi_provision_screen.dart')
          s = p.read_text(encoding='utf-8')
          start = s.find('  Future<bool> _ensureProvisioningBootstrap() async {')
          end = s.find('  Future<void> _scanQrAndConnect() async {', start)
          if start < 0 or end < 0:
              raise SystemExit('Provision bootstrap function markers missing')
          replacement = '''  Future<bool> _ensureProvisioningBootstrap() async {\n    if (!widget.session.authenticated) {\n      _setMessage('Cihaz kurulumu için önce uygulamaya giriş yapın.', error: true);\n      return false;\n    }\n    if (!widget.session.canManage) {\n      _setMessage(\n        'Cihaz yapılandırması yalnız firma yöneticisi hesabıyla yapılabilir.',\n        error: true,\n      );\n      return false;\n    }\n    if (_bootstrap != null) return true;\n\n    _setProgress(5, 'Sunucu yetkisi doğrulanıyor');\n    try {\n      final data = await widget.session.api.provisioningBootstrap();\n      final serverUrl = data['server_url']?.toString().trim() ?? '';\n      final companyKey = data['device_secret_key']?.toString().trim() ?? '';\n      final serverError = DeviceConfig.validateServerUrl(serverUrl);\n      final keyError = DeviceConfig.validateCompanyKey(companyKey);\n      if (serverError != null || keyError != null) {\n        throw const MobileApiException(\n          'Sunucudaki cihaz kurulum bilgileri eksik veya geçersiz.',\n        );\n      }\n      if (!mounted) return false;\n      setState(() => _bootstrap = Map<String, dynamic>.from(data));\n      _setProgress(10, 'Sunucu ayarları hazır');\n      return true;\n    } on MobileApiException catch (e) {\n      _setProgress(0, 'Kurulum başlatılamadı');\n      if (e.statusCode == 401) {\n        _setMessage(\n          'Mobil oturum doğrulanamadı. Oturumunuz uygulamada korunuyor; sunucu mobil provisioning yetkisini kontrol edin.',\n          error: true,\n        );\n      } else if (e.statusCode == 404) {\n        _setMessage(\n          'Mobil provisioning servisi sunucuda etkin değil. Web paketini v2.5.82 veya daha yeni sürüme güncelleyin.',\n          error: true,\n        );\n      } else {\n        _setMessage(e.message, error: true);\n      }\n      return false;\n    } catch (_) {\n      _setProgress(0, 'Kurulum başlatılamadı');\n      _setMessage(\n        'Kurulum bilgileri sunucudan alınamadı. İnternet bağlantısını kontrol edin.',\n        error: true,\n      );\n      return false;\n    }\n  }\n\n'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')

          # Remove the browser-cookie company-key helper from the mobile API.
          p = Path('lib/services/mobile_api_service.dart')
          s = p.read_text(encoding='utf-8')
          start = s.find('  Future<String> companyDeviceKey() async {')
          end = s.find('  Future<Map<String, dynamic>> history(', start)
          if start >= 0 and end > start:
              s = s[:start] + s[end:]
          p.write_text(s, encoding='utf-8')

          # Remove the session wrapper that could log the user out on /company/key 401.
          p = Path('lib/services/app_session.dart')
          s = p.read_text(encoding='utf-8')
          start = s.find('  Future<String?> fetchCompanyDeviceKey() async {')
          end = s.find('  Map<String, dynamic>? findDeviceBySerial(', start)
          if start >= 0 and end > start:
              s = s[:start] + s[end:]
          p.write_text(s, encoding='utf-8')

          # Keep the remembered-login wording explicit: password itself is never persisted.
          p = Path('lib/screens/mobile/login_screen.dart')
          s = p.read_text(encoding='utf-8')
          old = 'Oturumu açık tut seçiliyken uygulamayı kapatıp açmanız tekrar şifre istemez. ÇIKIŞ YAP işlemi oturumu bilinçli olarak kapatır.'
          new = 'Oturumu açık tut seçiliyken güvenli oturum anahtarı saklanır; uygulamayı kapatıp açınca şifre tekrar istenmez. Parolanız telefonda saklanmaz. ÇIKIŞ YAP oturumu kapatır.'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          r = Path('README.md')
          if r.exists():
              t = r.read_text(encoding='utf-8').replace('1.6.9+27', '1.6.11+29')
              r.write_text(t, encoding='utf-8')
          PY

      - name: Assert session and provisioning contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          pub = Path('pubspec.yaml').read_text(encoding='utf-8')
          screen = Path('lib/screens/wifi_provision_screen.dart').read_text(encoding='utf-8')
          api = Path('lib/services/mobile_api_service.dart').read_text(encoding='utf-8')
          session = Path('lib/services/app_session.dart').read_text(encoding='utf-8')
          login = Path('lib/screens/mobile/login_screen.dart').read_text(encoding='utf-8')
          qr = Path('lib/screens/provision_qr_scanner_screen.dart').read_text(encoding='utf-8')
          checks = {
              'version': ('version: 1.6.11+29', pub),
              'dedicated provisioning endpoint': ("'/mobile/provisioning/bootstrap'", api),
              'provisioning uses mobile endpoint': ('widget.session.api.provisioningBootstrap()', screen),
              'remember token storage': ("_storage.write(key: _tokenKey", session),
              'password not persisted wording': ('Parolanız telefonda saklanmaz', login),
              'QR scanner preserved': ('package:mobile_scanner/mobile_scanner.dart', qr),
              'determinate progress preserved': ('LinearProgressIndicator', screen),
          }
          missing = [k for k,(needle,text) in checks.items() if needle not in text]
          if missing:
              raise SystemExit(f'contract assert failed: {missing}')
          if "'/company/key'" in api:
              raise SystemExit('browser /company/key still present in mobile API')
          if 'fetchCompanyDeviceKey' in session or 'fetchCompanyDeviceKey' in screen:
              raise SystemExit('old company-key session helper still present')
          print('VisionSen Mobile v1.6.11+29 contract ASSERT PASS')
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Prepare Android platform
        run: bash tool/bootstrap_android_v169.sh

      - name: Enable unbundled ML Kit barcode model
        run: |
          set -euo pipefail
          PROP='dev.steenbakker.mobile_scanner.useUnbundled=true'
          if grep -q '^dev.steenbakker.mobile_scanner.useUnbundled=' android/gradle.properties; then
            sed -i 's/^dev\.steenbakker\.mobile_scanner\.useUnbundled=.*/dev.steenbakker.mobile_scanner.useUnbundled=true/' android/gradle.properties
          else
            printf '\n%s\n' "$PROP" >> android/gradle.properties
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Save universal APK
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk 'out/VisionSen-Mobile-v1.6.11+29-UNIVERSAL.apk'

      - name: Build ABI-split release APKs
        run: flutter build apk --release --split-per-abi

      - name: Package optimized APKs and source
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk 'out/VisionSen-Mobile-v1.6.11+29-ARM64.apk'
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk 'out/VisionSen-Mobile-v1.6.11+29-ARMv7.apk'
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk 'out/VisionSen-Mobile-v1.6.11+29-x86_64.apk'

          if unzip -l 'out/VisionSen-Mobile-v1.6.11+29-ARM64.apk' | grep -q 'libbarhopper'; then
            echo 'Bundled ML Kit libbarhopper still present; optimization failed.' >&2
            exit 1
          fi

          mkdir -p artifact-source
          cp pubspec.yaml README.md artifact-source/
          cp -R lib test tool artifact-source/
          cp android/gradle.properties artifact-source/android-gradle.properties
          zip -qr 'out/VisionSen-Mobile-v1.6.11+29-source.zip' artifact-source

          sha256sum out/*.apk > 'out/VisionSen-Mobile-v1.6.11+29-SHA256.txt'
          python3 - <<'PY'
          from pathlib import Path
          rows=[]
          for p in sorted(Path('out').glob('*.apk')):
              size=p.stat().st_size
              rows.append(f'{p.name}\t{size} bytes\t{size/1024/1024:.2f} MiB')
          report='\n'.join(rows)+'\n'
          Path('out/VisionSen-Mobile-v1.6.11+29-SIZE-REPORT.txt').write_text(report, encoding='utf-8')
          print(report)
          PY

      - name: Upload fixed APKs and source
        uses: actions/upload-artifact@v4
        with:
          name: VisionSen-Mobile-v1.6.11+29-Session-Provisioning-Fix
          path: out/
          if-no-files-found: error
          retention-days: 30
